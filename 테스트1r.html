<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Glassmorphism Calculator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js for soft tactile audio clicks -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- Inter Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          boxShadow: {
            'glass': '0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.15)',
            'key-press': 'inset 0 4px 8px rgba(0, 0, 0, 0.4)',
          }
        }
      }
    }
  </script>

  <style>
    /* Glassmorphism & custom utility styling */
    .glass-panel {
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .key-btn {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .key-btn:active, .key-btn.active-key {
      transform: scale(0.94);
      filter: brightness(1.25);
    }

    /* Custom thin scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 font-sans relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Ambient Background Lighting -->
  <div class="fixed -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="fixed -bottom-40 -right-40 w-96 h-96 bg-cyan-600/20 rounded-full blur-[120px] pointer-events-none"></div>

  <!-- Main Calculator Container -->
  <main class="w-full max-w-sm sm:max-w-md glass-panel rounded-3xl shadow-glass overflow-hidden flex flex-col relative border border-slate-700/50 z-10">

    <!-- Top Utility Bar -->
    <header class="flex items-center justify-between px-5 py-4 border-b border-white/5 bg-white/[0.02]">
      <div class="flex items-center space-x-2">
        <span class="inline-block w-3 h-3 rounded-full bg-rose-500/80"></span>
        <span class="inline-block w-3 h-3 rounded-full bg-amber-500/80"></span>
        <span class="inline-block w-3 h-3 rounded-full bg-emerald-500/80"></span>
        <span class="ml-2 text-xs tracking-wider font-semibold text-slate-400 uppercase">CALC.PRO</span>
      </div>

      <div class="flex items-center space-x-1">
        <!-- Sound Toggle Button -->
        <button id="soundToggleBtn" title="사운드 켜기/끄기" class="p-2 text-slate-400 hover:text-slate-100 hover:bg-white/5 rounded-xl transition">
          <svg id="soundOnIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
          </svg>
          <svg id="soundOffIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
          </svg>
        </button>

        <!-- History Drawer Button -->
        <button id="historyToggleBtn" title="계산 기록 열기" class="relative p-2 text-slate-400 hover:text-slate-100 hover:bg-white/5 rounded-xl transition flex items-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span id="historyBadge" class="hidden absolute top-1 right-1 w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span>
        </button>
      </div>
    </header>

    <!-- Display Screen -->
    <section class="p-6 pb-4 flex flex-col justify-end text-right min-h-[140px] bg-gradient-to-b from-transparent to-black/20">
      <!-- Secondary Expression Preview -->
      <div id="secondaryDisplay" class="font-mono text-sm sm:text-base text-slate-400 min-h-[1.5rem] tracking-wide overflow-x-auto whitespace-nowrap scrollbar-none"></div>
      
      <!-- Primary Output Value -->
      <div class="flex items-center justify-between mt-2">
        <button id="copyResultBtn" title="결과 복사하기" class="opacity-40 hover:opacity-100 p-1.5 text-slate-400 hover:text-indigo-400 hover:bg-white/5 rounded-lg transition-all" aria-label="결과값 복사">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path>
          </svg>
        </button>
        <div id="primaryDisplay" class="font-mono text-3xl sm:text-4xl font-semibold tracking-tight text-white overflow-x-auto whitespace-nowrap pl-2">0</div>
      </div>
    </section>

    <!-- Keypad Grid -->
    <section class="p-4 sm:p-5 pt-2 grid grid-cols-4 gap-2.5 sm:gap-3 bg-black/10">
      <!-- Row 1 -->
      <button data-action="clear" class="key-btn h-14 rounded-2xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/30 text-rose-400 font-semibold text-base shadow-sm">AC</button>
      <button data-action="bracket" class="key-btn h-14 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 text-slate-300 font-medium text-lg">( )</button>
      <button data-action="percent" class="key-btn h-14 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 text-slate-300 font-medium text-lg">%</button>
      <button data-action="operator" data-val="÷" class="key-btn h-14 rounded-2xl bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/30 text-indigo-300 font-semibold text-xl">÷</button>

      <!-- Row 2 -->
      <button data-action="number" data-val="7" class="key-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 border border-white/5 text-slate-100 font-medium text-xl font-mono">7</button>
      <button data-action="number" data-val="8" class="key-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 border border-white/5 text-slate-100 font-medium text-xl font-mono">8</button>
      <button data-action="number" data-val="9" class="key-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 border border-white/5 text-slate-100 font-medium text-xl font-mono">9</button>
      <button data-action="operator" data-val="×" class="key-btn h-14 rounded-2xl bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/30 text-indigo-300 font-semibold text-xl">×</button>

      <!-- Row 3 -->
      <button data-action="number" data-val="4" class="key-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 border border-white/5 text-slate-100 font-medium text-xl font-mono">4</button>
      <button data-action="number" data-val="5" class="key-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 border border-white/5 text-slate-100 font-medium text-xl font-mono">5</button>
      <button data-action="number" data-val="6" class="key-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 border border-white/5 text-slate-100 font-medium text-xl font-mono">6</button>
      <button data-action="operator" data-val="-" class="key-btn h-14 rounded-2xl bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/30 text-indigo-300 font-semibold text-xl">−</button>

      <!-- Row 4 -->
      <button data-action="number" data-val="1" class="key-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 border border-white/5 text-slate-100 font-medium text-xl font-mono">1</button>
      <button data-action="number" data-val="2" class="key-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 border border-white/5 text-slate-100 font-medium text-xl font-mono">2</button>
      <button data-action="number" data-val="3" class="key-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 border border-white/5 text-slate-100 font-medium text-xl font-mono">3</button>
      <button data-action="operator" data-val="+" class="key-btn h-14 rounded-2xl bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/30 text-indigo-300 font-semibold text-xl">+</button>

      <!-- Row 5 -->
      <button data-action="negate" class="key-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 border border-white/5 text-slate-300 font-medium text-lg font-mono">±</button>
      <button data-action="number" data-val="0" class="key-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 border border-white/5 text-slate-100 font-medium text-xl font-mono">0</button>
      <button data-action="decimal" class="key-btn h-14 rounded-2xl bg-slate-800/40 hover:bg-slate-700/50 border border-white/5 text-slate-100 font-medium text-xl font-mono">.</button>
      <button data-action="calculate" class="key-btn h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-cyan-500 hover:from-indigo-500 hover:to-cyan-400 text-white font-bold text-2xl shadow-lg shadow-indigo-500/25">=</button>
    </section>

    <!-- Bottom Action Ribbon -->
    <footer class="flex items-center justify-between px-5 py-3 border-t border-white/5 bg-slate-900/30 text-xs text-slate-400">
      <div class="flex items-center space-x-1.5">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>키보드 입력 지원</span>
      </div>
      <button data-action="backspace" class="key-btn flex items-center space-x-1 px-3 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6-7h12a2 2 0 012 2v10a2 2 0 01-2 2H9l-6-7z"></path>
        </svg>
        <span>지우기</span>
      </button>
    </footer>

    <!-- History Drawer Overlay -->
    <div id="historyDrawer" class="absolute inset-0 bg-slate-950/90 backdrop-blur-xl z-20 flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out">
      <!-- Drawer Header -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-white/10">
        <div class="flex items-center space-x-2">
          <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <h2 class="text-sm font-semibold text-slate-200">계산 기록</h2>
        </div>
        <div class="flex items-center space-x-2">
          <button id="clearHistoryBtn" title="기록 전체 삭제" class="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-white/5 rounded-lg transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
          <button id="closeHistoryBtn" title="닫기" class="p-1.5 text-slate-400 hover:text-slate-100 hover:bg-white/5 rounded-lg transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- History List Content -->
      <div id="historyList" class="flex-1 overflow-y-auto p-4 space-y-2">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toastNotification" class="absolute bottom-5 left-1/2 -translate-x-1/2 bg-indigo-600/90 backdrop-blur-md text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-30">
      복사되었습니다.
    </div>
  </main>

  <script>
    // --- Application State ---
    let expression = "";
    let currentInput = "0";
    let isEvaluated = false;
    let history = [];
    let isSoundEnabled = true;

    // --- DOM Elements ---
    const primaryDisplay = document.getElementById("primaryDisplay");
    const secondaryDisplay = document.getElementById("secondaryDisplay");
    const historyDrawer = document.getElementById("historyDrawer");
    const historyList = document.getElementById("historyList");
    const historyToggleBtn = document.getElementById("historyToggleBtn");
    const closeHistoryBtn = document.getElementById("closeHistoryBtn");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");
    const historyBadge = document.getElementById("historyBadge");
    const copyResultBtn = document.getElementById("copyResultBtn");
    const soundToggleBtn = document.getElementById("soundToggleBtn");
    const soundOnIcon = document.getElementById("soundOnIcon");
    const soundOffIcon = document.getElementById("soundOffIcon");
    const toastNotification = document.getElementById("toastNotification");

    // --- Audio Feedback (Tone.js Synth) ---
    let synth = null;
    function playClickSound(freq = 600) {
      if (!isSoundEnabled) return;
      try {
        if (!synth) {
          synth = new Tone.MembraneSynth({
            pitchDecay: 0.008,
            octaves: 2,
            oscillator: { type: "sine" },
            envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.05 }
          }).toDestination();
          synth.volume.value = -12;
        }
        if (Tone.context.state !== "running") {
          Tone.start();
        }
        synth.triggerAttackRelease(freq, "32n");
      } catch (e) {
        // Fallback silently if audio context is blocked
      }
    }

    // --- Toast Notification Handler ---
    let toastTimer = null;
    function showToast(message) {
      toastNotification.textContent = message;
      toastNotification.classList.remove("opacity-0");
      toastNotification.classList.add("opacity-100");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastNotification.classList.remove("opacity-100");
        toastNotification.classList.add("opacity-0");
      }, 1800);
    }

    // --- Local Storage Management ---
    function loadHistory() {
      try {
        const saved = localStorage.getItem("calc_pro_history");
        if (saved) {
          history = JSON.parse(saved);
          renderHistory();
        }
      } catch (err) {
        history = [];
      }
    }

    function saveHistory() {
      try {
        localStorage.setItem("calc_pro_history", JSON.stringify(history));
      } catch (err) {
        // quota exceeded or private mode
      }
    }

    // --- Display Update ---
    function updateDisplay() {
      primaryDisplay.textContent = currentInput;
      secondaryDisplay.textContent = expression;

      // Adjust font size dynamically for long numbers
      const len = currentInput.length;
      if (len > 12) {
        primaryDisplay.className = "font-mono text-xl sm:text-2xl font-semibold tracking-tight text-white overflow-x-auto whitespace-nowrap pl-2";
      } else if (len > 8) {
        primaryDisplay.className = "font-mono text-2xl sm:text-3xl font-semibold tracking-tight text-white overflow-x-auto whitespace-nowrap pl-2";
      } else {
        primaryDisplay.className = "font-mono text-3xl sm:text-4xl font-semibold tracking-tight text-white overflow-x-auto whitespace-nowrap pl-2";
      }
    }

    // --- Calculator Core Operations ---
    function appendNumber(num) {
      playClickSound(520);
      if (isEvaluated) {
        currentInput = num;
        expression = "";
        isEvaluated = false;
      } else {
        if (currentInput === "0" && num !== ".") {
          currentInput = num;
        } else {
          currentInput += num;
        }
      }
      updateDisplay();
    }

    function appendDecimal() {
      playClickSound(580);
      if (isEvaluated) {
        currentInput = "0.";
        expression = "";
        isEvaluated = false;
        updateDisplay();
        return;
      }

      // Check if current active number token already has a dot
      const lastNumberChunk = currentInput.split(/[+\-×÷]/).pop();
      if (!lastNumberChunk.includes(".")) {
        currentInput += ".";
      }
      updateDisplay();
    }

    function appendOperator(op) {
      playClickSound(640);
      if (isEvaluated) {
        expression = currentInput + " " + op + " ";
        currentInput = "0";
        isEvaluated = false;
      } else {
        if (currentInput === "0" && expression.length > 0) {
          // Replace trailing operator
          expression = expression.trim().replace(/[+\-×÷]$/, op) + " ";
        } else {
          expression += currentInput + " " + op + " ";
          currentInput = "0";
        }
      }
      updateDisplay();
    }

    function toggleSign() {
      playClickSound(480);
      if (currentInput === "0" || currentInput === "") return;
      if (currentInput.startsWith("-")) {
        currentInput = currentInput.substring(1);
      } else {
        currentInput = "-" + currentInput;
      }
      updateDisplay();
    }

    function applyPercent() {
      playClickSound(600);
      const val = parseFloat(currentInput);
      if (isNaN(val)) return;
      currentInput = formatResult(val / 100);
      updateDisplay();
    }

    function appendBracket() {
      playClickSound(620);
      const openCount = (expression + currentInput).split("(").length - 1;
      const closeCount = (expression + currentInput).split(")").length - 1;

      if (openCount > closeCount && currentInput !== "0" && !expression.endsWith("(")) {
        currentInput += ")";
      } else {
        if (currentInput === "0") {
          currentInput = "(";
        } else {
          currentInput += "(";
        }
      }
      updateDisplay();
    }

    function backspace() {
      playClickSound(420);
      if (isEvaluated) {
        currentInput = "0";
        isEvaluated = false;
      } else {
        if (currentInput.length > 1) {
          currentInput = currentInput.slice(0, -1);
        } else {
          currentInput = "0";
        }
      }
      updateDisplay();
    }

    function clearAll() {
      playClickSound(350);
      expression = "";
      currentInput = "0";
      isEvaluated = false;
      updateDisplay();
    }

    // High Precision & Clean Formatting Helper
    function formatResult(num) {
      if (!isFinite(num) || isNaN(num)) return "오류";
      // Prevent float precision artifacts (e.g. 0.1 + 0.2 = 0.30000000000000004)
      const rounded = parseFloat(num.toPrecision(12));
      return rounded.toString();
    }

    // Safe mathematical expression evaluation
    function evaluateExpression() {
      playClickSound(800);
      let fullExpr = expression + (currentInput !== "0" || expression === "" ? currentInput : "");
      fullExpr = fullExpr.trim();

      if (!fullExpr) return;

      // Clean sanitized string for math evaluation
      let sanitized = fullExpr
        .replace(/×/g, "*")
        .replace(/÷/g, "/")
        .replace(/−/g, "-");

      // Balance unclosed parenthesis automatically
      const openCount = (sanitized.match(/\(/g) || []).length;
      const closeCount = (sanitized.match(/\)/g) || []).length;
      if (openCount > closeCount) {
        sanitized += ")".repeat(openCount - closeCount);
      }

      // Security check: only allow safe numeric tokens and basic operators
      if (!/^[\d\s+\-*/().%]+$/.test(sanitized)) {
        currentInput = "오류";
        expression = "";
        isEvaluated = true;
        updateDisplay();
        return;
      }

      try {
        // Safe evaluation through Function without accessing window/DOM
        const evalFn = new Function(`'use strict'; return (${sanitized});`);
        const result = evalFn();

        if (result === Infinity || result === -Infinity) {
          currentInput = "0으로 나눌 수 없음";
        } else if (isNaN(result)) {
          currentInput = "오류";
        } else {
          const formatted = formatResult(result);
          // Add to calculation history
          addToHistory(fullExpr, formatted);
          currentInput = formatted;
        }

        secondaryDisplay.textContent = fullExpr + " =";
        isEvaluated = true;
        updateDisplay();
      } catch (err) {
        currentInput = "형식 오류";
        isEvaluated = true;
        updateDisplay();
      }
    }

    // --- History Management ---
    function addToHistory(expr, res) {
      history.unshift({ expr, res, date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
      if (history.length > 30) history.pop();
      saveHistory();
      renderHistory();
      historyBadge.classList.remove("hidden");
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = `
          <div class="h-48 flex flex-col items-center justify-center text-slate-500 text-xs">
            <svg class="w-8 h-8 mb-2 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            저장된 계산 기록이 없습니다.
          </div>
        `;
        historyBadge.classList.add("hidden");
        return;
      }

      historyList.innerHTML = history.map((item, idx) => `
        <div data-index="${idx}" class="history-item p-3 rounded-2xl bg-white/[0.03] hover:bg-white/[0.08] border border-white/5 cursor-pointer transition flex flex-col text-right group">
          <div class="flex justify-between items-center text-[10px] text-slate-500 mb-1">
            <span>${item.date}</span>
            <span class="opacity-0 group-hover:opacity-100 text-indigo-400 transition">불러오기</span>
          </div>
          <div class="text-xs text-slate-400 font-mono tracking-wide truncate">${item.expr}</div>
          <div class="text-base font-semibold text-slate-200 font-mono mt-0.5">${item.res}</div>
        </div>
      `).join("");

      // Add click events to recall calculation results
      document.querySelectorAll(".history-item").forEach(itemEl => {
        itemEl.addEventListener("click", () => {
          const idx = itemEl.getAttribute("data-index");
          const selected = history[idx];
          if (selected) {
            currentInput = selected.res;
            expression = "";
            isEvaluated = false;
            updateDisplay();
            toggleHistoryDrawer(false);
            showToast("계산값을 불러왔습니다.");
          }
        });
      });
    }

    function toggleHistoryDrawer(show) {
      if (show) {
        historyDrawer.classList.remove("translate-x-full");
        historyBadge.classList.add("hidden");
      } else {
        historyDrawer.classList.add("translate-x-full");
      }
    }

    // --- Event Listeners & Interaction ---
    document.querySelectorAll(".key-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const action = btn.dataset.action;
        const val = btn.dataset.val;

        switch (action) {
          case "number":
            appendNumber(val);
            break;
          case "operator":
            appendOperator(val);
            break;
          case "decimal":
            appendDecimal();
            break;
          case "calculate":
            evaluateExpression();
            break;
          case "clear":
            clearAll();
            break;
          case "bracket":
            appendBracket();
            break;
          case "percent":
            applyPercent();
            break;
          case "negate":
            toggleSign();
            break;
          case "backspace":
            backspace();
            break;
        }
      });
    });

    // Keyboard support with active key visual stimulation
    window.addEventListener("keydown", (e) => {
      let matchedBtn = null;

      if (e.key >= "0" && e.key <= "9") {
        appendNumber(e.key);
        matchedBtn = document.querySelector(`[data-val="${e.key}"]`);
      } else if (e.key === ".") {
        appendDecimal();
        matchedBtn = document.querySelector(`[data-action="decimal"]`);
      } else if (e.key === "+") {
        appendOperator("+");
        matchedBtn = document.querySelector(`[data-val="+"]`);
      } else if (e.key === "-") {
        appendOperator("-");
        matchedBtn = document.querySelector(`[data-val="-"]`);
      } else if (e.key === "*") {
        appendOperator("×");
        matchedBtn = document.querySelector(`[data-val="×"]`);
      } else if (e.key === "/") {
        e.preventDefault();
        appendOperator("÷");
        matchedBtn = document.querySelector(`[data-val="÷"]`);
      } else if (e.key === "%") {
        applyPercent();
        matchedBtn = document.querySelector(`[data-action="percent"]`);
      } else if (e.key === "(" || e.key === ")") {
        appendBracket();
        matchedBtn = document.querySelector(`[data-action="bracket"]`);
      } else if (e.key === "Enter" || e.key === "=") {
        e.preventDefault();
        evaluateExpression();
        matchedBtn = document.querySelector(`[data-action="calculate"]`);
      } else if (e.key === "Backspace") {
        backspace();
        matchedBtn = document.querySelector(`[data-action="backspace"]`);
      } else if (e.key === "Escape") {
        clearAll();
        matchedBtn = document.querySelector(`[data-action="clear"]`);
      }

      if (matchedBtn) {
        matchedBtn.classList.add("active-key");
        setTimeout(() => matchedBtn.classList.remove("active-key"), 120);
      }
    });

    // Copy to Clipboard (Fallback robustly supported inside frames)
    copyResultBtn.addEventListener("click", () => {
      const textToCopy = primaryDisplay.textContent;
      if (!textToCopy) return;

      const tempTextArea = document.createElement("textarea");
      tempTextArea.value = textToCopy;
      tempTextArea.style.position = "fixed";
      tempTextArea.style.opacity = "0";
      document.body.appendChild(tempTextArea);
      tempTextArea.select();

      try {
        document.execCommand("copy");
        showToast("결과값이 복사되었습니다.");
      } catch (err) {
        showToast("복사에 실패했습니다.");
      } finally {
        document.body.removeChild(tempTextArea);
      }
    });

    // Toggle History Drawer
    historyToggleBtn.addEventListener("click", () => toggleHistoryDrawer(true));
    closeHistoryBtn.addEventListener("click", () => toggleHistoryDrawer(false));
    clearHistoryBtn.addEventListener("click", () => {
      history = [];
      saveHistory();
      renderHistory();
      showToast("기록이 모두 삭제되었습니다.");
    });

    // Sound On/Off Toggle
    soundToggleBtn.addEventListener("click", () => {
      isSoundEnabled = !isSoundEnabled;
      soundOnIcon.classList.toggle("hidden", !isSoundEnabled);
      soundOffIcon.classList.toggle("hidden", !isSoundEnabled);
      showToast(isSoundEnabled ? "효과음이 켜졌습니다." : "효과음이 꺼졌습니다.");
    });

    // Initialization
    window.addEventListener("DOMContentLoaded", () => {
      loadHistory();
      updateDisplay();
    });
  </script>
</body>
</html>
